name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (no contract configured)
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_CONTRACT_ID: ""
          NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org

  e2e:
    name: playwright (375px)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # This is a real, already-deployed testnet contract
      # (SoroTip/sorotip-contracts) with no funds and no registered
      # creators — public on-chain data, not a secret. It lets the
      # Playwright suite exercise the real RPC-backed "creator not found"
      # path, not just the "no contract configured" fallback the other job
      # builds against.
      - name: Build (real testnet contract)
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_CONTRACT_ID: CBRFZJZIEY5X3YFDU475TM6IPHV6HXWAKXVJMFV6NKWISUH4ZRICN4FR
          NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-375px
          path: test-results/screenshots/
          retention-days: 14
